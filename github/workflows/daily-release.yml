name: release-on-lists-change

on:
  push:
    branches: [main]
    paths:
      - '**.lst'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release if lists changed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -n "$LAST" ] && git diff --quiet "$LAST" HEAD -- '*.lst'; then
            echo "Изменений в .lst нет, релиз не нужен"
            exit 0
          fi

          {
            if [ -z "$LAST" ]; then
              echo "Первая версия."
              echo

              git ls-files '*.lst' | while read -r f; do
                COUNT=$(grep -cvE '^\s*(#|$)' "$f" || true)
                echo "- \`$f\`: $COUNT строк"
              done
            else
              echo "## Что изменилось"
              echo

              git log --pretty='- %s' "$LAST"..HEAD -- '*.lst'
              echo

              git diff --name-only "$LAST" HEAD -- '*.lst' |
              while read -r f; do
                echo "### \`$f\`"
                echo '```diff'
                git diff -U0 "$LAST" HEAD -- "$f" |
                  grep -E '^[+-]' |
                  grep -vE '^(\+\+\+|---)' || true
                echo '```'
                echo
              done
            fi
          } > notes.md

          TAG="v$(date -u +%Y.%m.%d-%H%M%S)-${GITHUB_RUN_NUMBER}"

          echo "Создаём релиз: $TAG"

          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes-file notes.md
