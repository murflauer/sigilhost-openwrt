name: daily-release

on:
  schedule:
    - cron: "0 21 * * *"   
  workflow_dispatch:      

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release if lists changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -n "$LAST" ] && git diff --quiet "$LAST" HEAD -- '*.lst'; then
            echo "Изменений в .lst нет, релиз не нужен"
            exit 0
          fi

          {
            if [ -z "$LAST" ]; then
              echo "Первая версия."
              echo
              git ls-files '*.lst' | while read -r f; do
                echo "- \`$f\`: $(grep -cvE '^\s*(#|$)' "$f" || true) строк"
              done
            else
              echo "## Что изменилось"
              echo
              git log --pretty='- %s' "$LAST"..HEAD -- '*.lst'
              echo
              git diff --name-only "$LAST" HEAD -- '*.lst' | while read -r f; do
                echo "### \`$f\`"
                echo '```diff'
                git diff -U0 "$LAST" HEAD -- "$f" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true
                echo '```'
                echo
              done
            fi
          } > notes.md

          TAG="v$(date -u +%Y.%m.%d-%H%M)"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
