name: release-on-lists-change

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Telegram IP list
        run: |
          set -euo pipefail
          mkdir -p Telegram
          curl -fsSL --retry 3 https://core.telegram.org/resources/cidr.txt -o /tmp/cidr.txt

          tr -d '\r' < /tmp/cidr.txt \
            | grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$|^[0-9a-fA-F:]+/[0-9]{1,3}$' \
            | sort -u > /tmp/telegramip.lst

          COUNT=$(wc -l < /tmp/telegramip.lst)
          if [ "$COUNT" -lt 5 ]; then
            echo "Слишком мало подсетей ($COUNT), пропускаю обновление"
            exit 0
          fi

          cp /tmp/telegramip.lst Telegram/telegramip.lst

          if git diff --quiet -- Telegram/telegramip.lst; then
            echo "Telegram IP без изменений"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Telegram/telegramip.lst
          git commit -m "Auto-update Telegram IP list"
          git push

      - name: Release if lists changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -n "$LAST" ] && git diff --quiet "$LAST" HEAD -- '*.lst'; then
            echo "Изменений в .lst нет — релиз не нужен"
            exit 0
          fi

          {
            if [ -z "$LAST" ]; then
              echo "Первая версия."
              echo

              git ls-files '*.lst' | while read -r f; do
                COUNT=$(grep -cvE '^\s*(#|$)' "$f" || true)
                echo "- \`$f\`: $COUNT строк"
              done
            else
              echo "## Что изменилось"
              echo

              git log --pretty='- %s' "$LAST"..HEAD -- '*.lst'
              echo

              git diff --name-only "$LAST" HEAD -- '*.lst' |
              while read -r f; do
                echo "### \`$f\`"
                echo '```diff'
                git diff -U0 "$LAST" HEAD -- "$f" |
                  grep -E '^[+-]' |
                  grep -vE '^(\+\+\+|---)' || true
                echo '```'
                echo
              done
            fi
          } > notes.md

          TAG="v$(date -u +%Y.%m.%d-%H%M%S)-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes-file notes.md
